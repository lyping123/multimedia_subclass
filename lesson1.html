<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Day 1 Demo</title>
  <link rel="stylesheet" href="styles-demo.css" />
</head>
<style>
    *{
        box-sizing:border-box;
        font-family:system-ui,Arial,sans-serif;
    }
    body{
        margin:0;background:#f5fbff;
        color:#0f2233;
        line-height:1.5;
        padding:1rem;
    }
    header{
        text-align:center;
        padding:1rem 0;
        margin-bottom:1rem;
        background:#ffffff;
        border:1px solid #d9e6f2;
        border-radius:.5rem;
    }
    .intro{
        color:#4b6476;
    }
    section {
        max-width: 720px;
        margin: 0 auto 1.5rem;
        padding: 1rem;
        background: #fff;
        border: 1px solid #d9e6f2;
        border-radius: 0.5rem;
    }

    #info img {
        display: block;
        margin: 0.5rem auto;
        border: 2px solid #89c8ff;
        border-radius: 0.5rem;
    }

    form {
        display: grid;
        gap: 1rem;
    }

    .field {
        display: grid;
        gap: 0.35rem;
    }

    label {
        font-weight: 600;
    }

    input,
    select,
    textarea {
        padding: 0.6rem 0.7rem;
        border: 1px solid #b7c9d9;
        border-radius: 0.5rem;
        font-size: 1rem;
        background: #fdfdfd;
    }

    input:focus,
    select:focus,
    textarea:focus {
        outline: 2px solid #0077ff;
        background: #fff;
    }

    .primary-btn {
        cursor: pointer;
        padding: 0.7rem 1.1rem;
        font-size: 1rem;
        border: none;
        border-radius: 0.6rem;
        background: #0077ff;
        color: #fff;
        font-weight: 600;
        transition: background 0.3s, transform 0.15s;
    }

    .primary-btn:hover {
        background: #005fcc;
    }


    #message {
        margin-top: 1rem;
        padding: 0.8rem 1rem;
        border-radius: 0.5rem;
        border: 1px solid #0077ff;
        background: #e6f2ff;
    }

    .hidden {
        display: none;
    }

    @media (max-width: 600px) {
        body {
            padding: 0.5rem;
        }
        section {
            padding: 0.8rem;
        }
        form {
            gap: 0.75rem;
        }
    }

</style>
<body>
  <header>
    <h1>Welcome to the Aquarium Form</h1>
    <p class="intro">Today we learn HTML & CSS basics.</p>
  </header>

  <section id="info">
    <h2>About</h2>
    <p>This page collects visitor interests for future events.</p>
    <img src="image/reef.jpeg" alt="Colorful coral reef" width="300" />
  </section>

  <section id="signup" aria-label="Visitor interest form">
    <h2>Sign Up</h2>
    <form id="interestForm" action="#" method="post">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your full name" required />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>
      <div class="field">
        <label for="favorite">Favorite Exhibit</label>
        <select id="favorite" name="favorite">
          <option value="reef">Coral Reef</option>
          <option value="shark">Sharks</option>
          <option value="jellyfish">Jellyfish</option>
        </select>
      </div>
      <div class="field">
        <label for="comments">Comments</label>
        <textarea id="comments" name="comments" rows="4" placeholder="Any interests or questions..."></textarea>
      </div>
      <button type="submit" class="primary-btn">Submit</button>
    </form>
    <div id="message" class="hidden" role="alert"></div>
  </section>

  <script src="demo.js"></script>
</body>
</html>
